[workspace]
members = [
    "crates/mog-cli",
    "crates/mog-core",
    "crates/mog-graph",
    "crates/mog-auth",
    "crates/mog-mail",
    "crates/mog-calendar",
    "crates/mog-files",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bighatgroup/mog"

[workspace.dependencies]
# Shared across workspace
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
comfy-table = "7"
base64 = "0.22"
url = "2"
rand = "0.8"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
aes-gcm = "0.10"
oauth2 = "5.0.0-rc.1"
atty = "0.2"

# Workspace crates
mog-core = { path = "crates/mog-core" }
mog-graph = { path = "crates/mog-graph" }
mog-auth = { path = "crates/mog-auth" }
mog-mail = { path = "crates/mog-mail" }
mog-calendar = { path = "crates/mog-calendar" }
mog-files = { path = "crates/mog-files" }
